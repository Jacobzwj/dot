(function(root){
'use strict';
class CatGame {
 constructor(seed=12){this.seed=seed;this.reset()}
 random(){this.seed=(this.seed*1664525+1013904223)>>>0;return this.seed/4294967296}
 reset(){this.time=45;this.score=0;this.hearts=3;this.count=0;this.combo=0;this.bestCombo=0;this.phase='safe';this.phaseTime=3.7;this.phaseTotal=3.7;this.progress=0;this.cooldown=0;this.mustRelease=false;this.active=false;this.ended=false;this.events=[];this.objectIndex=0;this.safeRounds=0;this.pushing=false;this.gazeHeld=0;return this}
 start(){this.reset();this.active=true}
 setPhase(phase,seconds){this.phase=phase;this.phaseTime=seconds;this.phaseTotal=seconds;this.events.push({type:'phase',phase})}
 tick(dt,held){this.events=[];this.pushing=false;if(!this.active||this.ended)return this.events;dt=Math.min(Math.max(dt,0),.05);this.time=Math.max(0,this.time-dt);this.cooldown=Math.max(0,this.cooldown-dt);if(!held)this.mustRelease=false;this.phaseTime-=dt;
 if(this.phaseTime<=0){if(this.phase==='safe')this.setPhase('warning',1.05);else if(this.phase==='warning')this.setPhase('watch',1.5+this.random()*.35);else{this.safeRounds++;this.setPhase('safe',3.1+this.random()*1.35)}}
 if(this.phase==='watch'&&held&&!this.mustRelease&&this.cooldown<=0){this.gazeHeld+=dt;if(this.gazeHeld>=.08){this.hearts--;this.combo=0;this.progress=Math.max(0,this.progress-.25);this.cooldown=1;this.mustRelease=true;this.gazeHeld=0;this.events.push({type:'caught',hearts:this.hearts})}}else this.gazeHeld=0;
 if(held&&!this.mustRelease&&this.phase!=='watch'&&this.cooldown<=0){this.pushing=true;this.progress+=dt/(.69+(this.objectIndex%3)*.07);if(this.progress>=1){this.progress=0;this.count++;this.combo=Math.min(5,this.combo+1);this.bestCombo=Math.max(this.bestCombo,this.combo);const risky=this.phase==='warning';const value=100*this.combo+(risky?150:0);this.score+=value;this.events.push({type:'knock',value,combo:this.combo,risky,index:this.objectIndex});this.objectIndex++}}
 if(this.time<=0||this.hearts<=0){this.active=false;this.ended=true;this.pushing=false;this.events.push({type:'end',win:this.count>=12})}return this.events
 }
}
if(typeof module!=='undefined')module.exports=CatGame;else root.CatGame=CatGame;
})(typeof window!=='undefined'?window:globalThis);

</script>
